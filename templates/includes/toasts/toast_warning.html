<div class="toast custom-toast rounded-0 border-top-0"
     role="alert"
     aria-live="assertive"
     aria-atomic="true"
     data-bs-autohide="true"
     data-bs-delay="3000">

    <!-- Top color bar -->
    <div class="toast-capper w-100 bg-warning"></div>

    <!-- Header -->
    <div class="toast-header">
        <strong class="me-auto">Warning!</strong>
        <button type="button" class="btn-close ms-2 mb-1 text-dark" 
                data-bs-dismiss="toast" aria-label="Close"></button>
    </div>

    <!-- Body -->
    <div class="toast-body">
        {{ message }}
    </div>
</div>
