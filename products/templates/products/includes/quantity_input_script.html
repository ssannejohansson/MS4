<script type="text/javascript">

// Disable +/- buttons outside 1–99 range
function handleEnableDisable(itemId) {
    const input = document.getElementById(`id_qty_${itemId}`);
    const currentValue = parseInt(input.value);

    const minusButton = document.getElementById(`decrement-qty_${itemId}`);
    const plusButton = document.getElementById(`increment-qty_${itemId}`);

    minusButton.disabled = currentValue < 2;
    plusButton.disabled = currentValue > 98;
}

// Ensure proper enabling/disabling of all inputs on page load
const allQtyInputs = document.querySelectorAll('.qty_input');
allQtyInputs.forEach(input => {
    const itemId = input.dataset.item_id;
    handleEnableDisable(itemId);
});

// Check enable/disable every time the input value changes
allQtyInputs.forEach(input => {
    input.addEventListener('change', function() {
        const itemId = this.dataset.item_id;
        handleEnableDisable(itemId);
    });
});

// Increment quantity
document.querySelectorAll('.increment-qty').forEach(button => {
    button.addEventListener('click', function(e) {
        e.preventDefault();

        const itemId = this.dataset.item_id;
        const input = this.closest('.input-group').querySelector('.qty_input');
        input.value = parseInt(input.value) + 1;

        handleEnableDisable(itemId);
    });
});

// Decrement quantity
document.querySelectorAll('.decrement-qty').forEach(button => {
    button.addEventListener('click', function(e) {
        e.preventDefault();

        const itemId = this.dataset.item_id;
        const input = this.closest('.input-group').querySelector('.qty_input');
        input.value = parseInt(input.value) - 1;

        handleEnableDisable(itemId);
    });
});

</script>
