{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<main class="container-fluid">
    <section class="wrapper d-flex flex-column align-items-center text-center">
        <div class="row">
            <div class="col-12 mt-4 mb-3">
                <h2 class="mb-4">Contact Us</h2>
                <p class="text-muted custom-text-muted">Please reach out with any questions or issues.</p>
            </div>
        </div>

        <div class="row ps-2 pe-2">
            <!-- Contact form -->
            <div class="col-12">
                <form method="post" class="mt-4">
                    {% csrf_token %}
                    {{ form|crispy }}

                    <button type="submit" class="btn leather-btn">Send</button>
                </form>
            </div>
        </div>
    </section>
</main>
{% endblock %}
