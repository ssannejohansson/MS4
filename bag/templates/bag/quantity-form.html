<div class="bag-item-row" data-item_id="{{ item.item_id }}">

    <form class="update-form" method="POST" action="{% url 'adjust_bag' item.item_id %}">
        {% csrf_token %}
        <div class="input-group input-group-sm">

            <!-- Minus -->
            <button type="button"
                class="btn quantity-btn decrement-qty rounded-0"
                data-item_id="{{ item.item_id }}">
                <i class="fas fa-minus fa-sm"></i>
            </button>

            <!-- Quantity Input -->
            <input class="form-control custom-form-control qty_input"
                type="number"
                name="quantity"
                value="{{ item.quantity }}"
                min="1"
                max="99"
                data-item_id="{{ item.item_id }}"
                aria-label="Quantity for {{ item.variant.product.name }}">

            <!-- Plus -->
            <button type="button"
                class="btn quantity-btn increment-qty rounded-0"
                data-item_id="{{ item.item_id }}">
                <i class="fas fa-plus fa-sm"></i>
            </button>

        </div>
    </form>

    <a class="update-link custom-text-muted float-start" data-item_id="{{ item.item_id }}">
        <small>Update</small>
    </a>

    <a class="remove-item text-danger float-end" data-item_id="{{ item.item_id }}">
        <small>Remove</small>
    </a>

</div>
